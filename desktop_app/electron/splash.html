<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prometeo PACS — Iniciando...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 500px;
      height: 320px;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 32px 28px 24px 28px;
      overflow: hidden;
      border: 1px solid rgba(234, 88, 12, 0.35);
      border-radius: 12px;
      -webkit-app-region: drag;
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #ea580c, #f97316);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(234, 88, 12, 0.5);
    }

    .brand-icon svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .app-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-version {
      font-size: 11px;
      font-weight: 600;
      background: rgba(234, 88, 12, 0.2);
      color: #fb923c;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(234, 88, 12, 0.4);
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 88, 12, 0.15);
      border-top-color: #ea580c;
      border-right-color: #f97316;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      box-shadow: 0 0 18px rgba(234, 88, 12, 0.3);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-track {
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #ea580c, #fb923c, #ea580c);
      border-radius: 999px;
      animation: pulse-indeterminate 1.6s ease-in-out infinite;
    }

    @keyframes pulse-indeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 40%;
      }
    }

    .status-text {
      font-size: 12px;
      color: #cbd5e1;
      text-align: center;
      font-weight: 500;
      min-height: 18px;
      letter-spacing: 0.3px;
    }

    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-row">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L4 6v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V6l-8-4zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm4 11.2c-1.16.8-2.54 1.35-4 1.6-1.46-.25-2.84-.8-4-1.6V16c0-1.33 2.67-2 4-2s4 .67 4 2v1.2z"/>
        </svg>
      </div>
      <h1 class="app-title">PROMETEO PACS</h1>
      <span class="app-version">v2.0</span>
    </div>
    <p class="subtitle">Estación Radiológica Neuro-Simbólica</p>
  </div>

  <div class="loader-container">
    <div class="spinner-ring"></div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <p class="status-text" id="statusMessage">Iniciando motor neuro-simbólico y backend FastAPI...</p>
  </div>

  <div class="footer">
    Universidad El Bosque · Facultad de Ciencias
  </div>
</body>
</html>
